[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustkd"
version = "0.1.0"
description = "RobustKD implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "torch>=2.4,<3", "torchvision>=0.19,<1", "Pillow>=10,<13"]

[project.scripts]
robustkd-report = "robustkd.common:report"
robustkd = "robustkd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
